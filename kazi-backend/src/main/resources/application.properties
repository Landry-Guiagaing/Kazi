# Nom de l'application
spring.application.name=kazi-backend

# Port du serveur
server.port=8080

# Connexion PostgreSQL (port standard 5432)
spring.datasource.url=jdbc:postgresql://localhost:5432/kazi_db
spring.datasource.username=kazi_user
spring.datasource.password=kazi_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logs
logging.level.root=INFO
logging.level.com.kazi.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Désactiver la sécurité par défaut (temporaire, pour tester l'API)
spring.security.user.name=admin
spring.security.user.password=admin